name: Release

run-name: Release FRPS from ${{ github.ref_name }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify IPK/APK artifacts without publishing a GitHub Release'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: frps-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      full_version: ${{ steps.meta.outputs.full_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shared validation checks
        shell: bash
        run: bash tests/validate.sh

      - name: Validate FRPS release target
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          [ "$GITHUB_REF" = "refs/heads/main" ]

          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          PKG_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"

          [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PKG_RELEASE" =~ ^[0-9]+$ ]]

          TAG="v${PKG_VERSION}"
          FULL_VERSION="${PKG_VERSION}-r${PKG_RELEASE}"

          if [ "$DRY_RUN" != "true" ]; then
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null
            tag_rc=$?
            set -e

            if [ "$tag_rc" -eq 0 ]; then
              echo "Tag $TAG already exists." >&2
              exit 1
            elif [ "$tag_rc" -ne 2 ]; then
              echo "Failed to query remote tag $TAG (git ls-remote exit code: $tag_rc)." >&2
              exit 1
            fi

            set +e
            rel_out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"
            rel_rc=$?
            set -e

            if [ "$rel_rc" -eq 0 ]; then
              echo "Release $TAG already exists." >&2
              exit 1
            elif ! printf '%s\n' "$rel_out" | grep -q 'HTTP 404'; then
              echo "Failed to query release $TAG: $rel_out" >&2
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            sdk_version: 24.10.6
            sdk_file: immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_url: https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 8b4340a9b7e8802a7ffa6feb99604a27025cf702baeab052b931f1bfa6a9f638
          - format: apk
            sdk_version: 25.12.1
            sdk_file: immortalwrt-sdk-25.12.1-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_url: https://downloads.immortalwrt.org/releases/25.12.1/targets/mediatek/filogic/immortalwrt-sdk-25.12.1-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 1dede7c6afa3184eda37511e47a628f6674d2da2ce99a65f788f910ec57c9e5a

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache verified SDK archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/sdk-download/${{ matrix.sdk_file }}
          key: immortalwrt-sdk-${{ matrix.format }}-${{ matrix.sdk_version }}-${{ matrix.sdk_sha256 }}

      - name: Download and verify SDK
        env:
          SDK_FILE: ${{ matrix.sdk_file }}
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/sdk-download /tmp/sdk
          ARCHIVE="/tmp/sdk-download/$SDK_FILE"

          if [ -f "$ARCHIVE" ] && echo "$SDK_SHA256  $ARCHIVE" | sha256sum -c -; then
            echo "Using verified cached SDK archive: $SDK_FILE"
          else
            rm -f "$ARCHIVE"
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 15 \
              --connect-timeout 20 \
              --max-time 1200 \
              --output "$ARCHIVE" \
              "$SDK_URL"
            echo "$SDK_SHA256  $ARCHIVE" | sha256sum -c -
          fi

          tar -xf "$ARCHIVE" -C /tmp/sdk --strip-components=1
          grep -q '${{ matrix.sdk_version }}' /tmp/sdk/include/version.mk

      - name: Build FRPS ${{ matrix.format }} packages
        env:
          FORMAT: ${{ matrix.format }}
          FULL_VERSION: ${{ needs.preflight.outputs.full_version }}
        shell: bash
        run: |
          set -euo pipefail

          SDK=/tmp/sdk
          PKG_DIR="$SDK/package/luci-app-frps-advanced"

          cd "$SDK"

          if [ ! -f feeds/luci/luci.mk ]; then
            timeout 10m ./scripts/feeds update base packages luci
            timeout 10m ./scripts/feeds install -a
          fi

          test -f feeds/luci/luci.mk

          rm -rf "$PKG_DIR"
          cp -a "$GITHUB_WORKSPACE" "$PKG_DIR"
          rm -rf "$PKG_DIR/.git" "$PKG_DIR/dist" "$PKG_DIR/release" "$PKG_DIR/release-apk"

          find bin -type f \( -name '*frps-advanced*.ipk' -o -name '*frps-advanced*.apk' \) -delete 2>/dev/null || true

          printf '%s\n' \
            'CONFIG_PACKAGE_luci-app-frps-advanced=y' \
            'CONFIG_PACKAGE_luci-i18n-frps-advanced-zh-cn=y' >> .config

          make defconfig
          grep -qx 'CONFIG_PACKAGE_luci-app-frps-advanced=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-frps-advanced-zh-cn=y' .config
          timeout 35m make package/luci-app-frps-advanced/compile V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"

          if [ "$FORMAT" = "ipk" ]; then
            mapfile -t MAIN < <(find bin -type f -name "luci-app-frps-advanced_${FULL_VERSION}_all.ipk")
            mapfile -t I18N < <(find bin -type f -name "luci-i18n-frps-advanced-zh-cn_${FULL_VERSION}_all.ipk")
            [ "${#MAIN[@]}" -eq 1 ]
            [ "${#I18N[@]}" -eq 1 ]
            ! find bin -type f -name '*frps-advanced*.apk' | grep -q .
          else
            mapfile -t MAIN < <(find bin -type f -name 'luci-app-frps-advanced*.apk' | sort)
            mapfile -t I18N < <(find bin -type f -name 'luci-i18n-frps-advanced-zh-cn*.apk' | sort)
            [ "${#MAIN[@]}" -eq 1 ]
            [ "${#I18N[@]}" -eq 1 ]
            case "$(basename "${MAIN[0]}")" in *"$FULL_VERSION"*.apk) ;; *) echo "Unexpected FRPS APK version" >&2; exit 1 ;; esac
            case "$(basename "${I18N[0]}")" in *"$FULL_VERSION"*.apk) ;; *) echo "Unexpected FRPS i18n APK version" >&2; exit 1 ;; esac
            ! find bin -type f -name '*frps-advanced*.ipk' | grep -q .
          fi

          cp "${MAIN[0]}" "${I18N[0]}" "$GITHUB_WORKSPACE/dist/"
          find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -size 0 -print -quit | grep -q . && exit 1 || true
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload FRPS ${{ matrix.format }} artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frps-release-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download FRPS package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frps-release-*
          path: dist
          merge-multiple: true

      - name: Verify FRPS release assets
        env:
          FULL_VERSION: ${{ needs.preflight.outputs.full_version }}
        shell: bash
        run: |
          set -euo pipefail

          [ "$(find dist -maxdepth 1 -type f -name '*.ipk' | wc -l)" -eq 2 ]
          [ "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2 ]

          while IFS= read -r file; do
            [ -s "$file" ]
            case "$(basename "$file")" in
              *"$FULL_VERSION"*) ;;
              *) echo "Unexpected FRPS package version: $file" >&2; exit 1 ;;
            esac
          done < <(find dist -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | sort)

          (
            cd dist
            sha256sum *.ipk *.apk | sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish FRPS GitHub Release (atomic draft -> publish)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            dist/*.ipk \
            dist/*.apk \
            dist/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" \
            --title "luci-app-frps $TAG" \
            --generate-notes

          gh release edit "$TAG" --draft=false
